image = "${APERTUS2_IMAGE}"

mounts = [
    "/capstor/",
    "/iopsstor/",
    "/ritom/",
    "${HOME}:${HOME}",
]

workdir = "${PWD}"
writable = true

[env]
UCCL_EP_TRANSPORT = "cxi"
PMIX_MCA_psec = "native"
NCCL_PXN_DISABLE = "1"
NCCL_CROSS_NIC = "0"

[annotations]
com.hooks.cxi.enabled = "false"
com.hooks.netstack.source = "artifact"
